# Kaggle T4. Run 2: bigger LoRA (r 16, attention + MLP) to test whether r8 plateaued from lack of capacity.
run_name: kaggle-r16-all
seed: 42
device: auto
wandb: true

model:
  name: Qwen/Qwen3-0.6B-Base
  dtype: float16      # T4 has no bfloat16 hardware; fall back to float32 if NaNs
  max_length: 512

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_subsample: null
  val_subsample: null

train:
  epochs: 1
  max_steps: null      # full epoch, same schedule as run 1 so the val curves compare step by step
  batch_size: 4
  grad_accum: 4         # effective batch 16
  lr_lora: 2.0e-4
  lr_head: 1.0e-3
  warmup_ratio: 0.05
  eval_every: 500
  eval_batch_size: 16
