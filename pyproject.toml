[project]
name = "asrs-lora-classifier"
version = "0.1.0"
description = "LoRA fine-tuning of a small LLM for multi-label NASA ASRS incident classification, compared with TF-IDF and a frontier model"
readme = "README.md"
authors = [
    { name = "Alvaro Serero", email = "alvaroserero@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.6",
    "transformers>=5.22.2",
    "wandb>=0.31.0",
]

[project.scripts]
asrs-lora-classifier = "asrs_lora_classifier:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
